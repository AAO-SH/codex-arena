name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish
        type: choice
        options: [both, npm, pypi]
        default: both
        required: true

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('packaging/payload-manifest.json').read_text())['version']
          tag = os.environ['RELEASE_TAG']
          if tag and tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} does not match package version {version!r}')
          PY
      - run: python -m pip install -r requirements-dev.txt -r requirements-publish.txt
      - run: python -m pytest -q
      - run: python packaging/build_distribution.py --output dist
      - run: python -m twine check --strict dist/pypi/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: registry-packages
          path: dist/
          if-no-files-found: error

  npm:
    needs: verify
    if: ${{ github.event_name == 'release' || inputs.registry == 'both' || inputs.registry == 'npm' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: registry-packages
          path: dist/
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - name: Publish npm tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/arena.npmrc
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          else
            : > "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish dist/npm/*.tgz --access public --provenance --registry=https://registry.npmjs.org

  pypi:
    needs: verify
    if: ${{ github.event_name == 'release' || inputs.registry == 'both' || inputs.registry == 'pypi' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: registry-packages
          path: dist/
      - name: Publish wheel and source distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi/
          password: ${{ secrets.PYPI_API_TOKEN }}
